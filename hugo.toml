baseURL = 'https://ctrlspice.codes/'
locale = 'en-ca'
title = 'CtrlSpice'

[module]
[[module.imports]]
path = 'github.com/adityatelange/hugo-PaperMod'

# Hugo caches remote fetches forever by default; the CV's adoption numbers come
# from the GitHub API via the repo-stats shortcode, so expire them instead.
# 10m is a debounce, not a freshness limit: CI builds start with a cold cache
# and always fetch, while a local `hugo server` reuses one response across a
# editing session rather than spending two API calls per file save (the
# unauthenticated limit is 60/hour, and rate-limited builds fall back to the
# counts hardcoded in the shortcode's params).
[caches.getresource]
maxage = '10m'

[menu]
[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 20

[params]
  author = 'Mila Ardath'

  # Favicon set: a telescope from Hugeicons (MIT), in the site's own dark
  # palette. No .ico — nothing on hand writes that format, and every browser
  # we care about takes a PNG, so `favicon` points at the 32px one.
  [params.assets]
    favicon = "/favicon-32x32.png"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    safari_pinned_tab = "/safari-pinned-tab.svg"

  # Posts live directly in content/, so their Type is "page" rather than a
  # section name. Without this PaperMod's home page filters them all out and
  # lists nothing.
  mainSections = ['page']

  # Counterscale analytics, self-hosted on our own Cloudflare account.
  # Rendered by layouts/partials/extend_head.html, production builds only.
  [params.counterscale]
    url = 'https://counterscale.amelia-ardath.workers.dev'
    siteId = 'ctrlspice-codes'

  # One quiet line in the footer, between the copyright and the Hugo credit.
  [params.footer]
    text = '[Available for work — observability and developer tooling.](/cv/)'

  [params.homeInfoParams]
  Title = "Hello there!"
  Content = "Welcome to my blog, where I mostly share thoughts about programming, with the occasional picture of the local bears, just to spice things up. Also, please feel free to reach out."


[[params.socialIcons]]
  name = "github"
  url = "https://github.com/CtrlSpice"

[[params.socialIcons]]
  name = "bluesky"
  url = "https://bsky.app/profile/CtrlSpice.bsky.social"

[[params.socialIcons]]
  name = "email"
  url = "mailto:amelia.ardath@gmail.com"

# Author / availability block appended to posts.
# Rendered by layouts/partials/hire-cta.html.
# When the job search ends, either set `enabled = false` or just clear
# `availability` to keep the byline without the pitch.
[params.hire]
  enabled = true
  blurb = "Written by **Mila Ardath**. I build developer tools and observability infrastructure — currently [otel-desktop-viewer](https://github.com/CtrlSpice/otel-desktop-viewer), a local viewer for OpenTelemetry traces, metrics, and logs."
  availability = "I'm looking for my next full-time role. If you're building developer tools or working on observability, I'd like to hear from you."
  email = "amelia.ardath@gmail.com"
  bluesky = "https://bsky.app/profile/CtrlSpice.bsky.social"
  github = "https://github.com/CtrlSpice"

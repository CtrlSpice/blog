{{/*
  The hire block used to live here, but PaperMod renders the footer through
  `partialCached`, so a single page opting out with hideCTA suppressed it
  everywhere. It now lives in extend_post_content.html, which is called
  per-post and uncached.
*/}}

<script>
  (() => {
    const updateScrollableRegions = () => {
      document.querySelectorAll('.post-content pre code, .post-content table').forEach((region) => {
        if (region.matches('pre code')) {
          region.closest('pre')?.removeAttribute('tabindex');
        }

        const overflows = region.scrollWidth > region.clientWidth;

        if (overflows) {
          region.tabIndex = 0;
          region.dataset.scrollFocus = '';
        } else if ('scrollFocus' in region.dataset) {
          region.removeAttribute('tabindex');
          delete region.dataset.scrollFocus;
        }
      });
    };

    updateScrollableRegions();
    document.fonts?.ready.then(updateScrollableRegions);
    window.addEventListener('resize', updateScrollableRegions);

    const initializeCopyButtons = () => {
      document.querySelectorAll('.copy-code:not([data-copy-state-ready])').forEach((button) => {
        button.dataset.copyStateReady = '';

        const updateCopiedState = () => {
          const copied = button.textContent.trim() === 'copied!';
          button.toggleAttribute('data-copied', copied);
          button.setAttribute('aria-label', copied ? 'Copied' : 'Copy code');
        };

        updateCopiedState();
        new MutationObserver(updateCopiedState).observe(button, {
          childList: true,
          characterData: true,
          subtree: true
        });
      });
    };

    initializeCopyButtons();
    new MutationObserver(initializeCopyButtons).observe(document.body, {
      childList: true,
      subtree: true
    });

    document.querySelectorAll('.footnote-ref, .footnote-backref').forEach((link) => {
      link.addEventListener('click', (event) => {
        const target = document.getElementById(decodeURIComponent(link.hash.slice(1)));
        if (!target) return;

        event.preventDefault();
        event.stopImmediatePropagation();
        target.scrollIntoView();
        history.pushState(null, '', link.hash);
      });
    });
  })();
</script>

{{- if .HasShortcode "mermaid" -}}
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  (() => {
    const root = document.documentElement;
    const diagrams = [...document.querySelectorAll('.mermaid')];

    diagrams.forEach((diagram) => {
      diagram.dataset.mermaidSource = diagram.innerHTML.trim();
    });

    const palette = () => {
      const style = getComputedStyle(root);
      const colour = (role) => style.getPropertyValue(`--color-${role}`).trim();
      return {
        darkMode: root.dataset.theme === 'dark',
        background: colour('base-100'),
        primaryColor: colour('base-200'),
        primaryTextColor: colour('base-content'),
        primaryBorderColor: colour('primary'),
        secondaryColor: colour('base-200'),
        tertiaryColor: colour('highlight-low'),
        lineColor: colour('subtle'),
        textColor: colour('base-content'),
        mainBkg: colour('base-200'),
        nodeBorder: colour('primary'),
        clusterBkg: colour('base-200'),
        clusterBorder: colour('highlight-low'),
        edgeLabelBackground: colour('base-100'),
        titleColor: colour('base-content')
      };
    };

    let render = Promise.resolve();

    const renderDiagrams = () => {
      render = render.then(async () => {
        mermaid.initialize({
          startOnLoad: false,
          theme: 'base',
          themeVariables: {
            fontFamily: "'Atkinson Hyperlegible Next', system-ui, sans-serif",
            fontSize: '15px',
            ...palette()
          },
          flowchart: {
            htmlLabels: true,
            useMaxWidth: true
          }
        });

        diagrams.forEach((diagram) => {
          diagram.innerHTML = diagram.dataset.mermaidSource;
          diagram.removeAttribute('data-processed');
        });

        await mermaid.run({ nodes: diagrams });
      }).catch((error) => console.error('Could not render Mermaid diagram', error));
    };

    renderDiagrams();

    new MutationObserver(renderDiagrams).observe(root, {
      attributes: true,
      attributeFilter: ['data-theme', 'data-season']
    });
  })();
</script>
{{- end -}}

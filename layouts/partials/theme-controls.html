<div class="seasonal-controls" role="group" aria-label="Appearance" hidden>
  <button type="button" id="season-toggle" aria-haspopup="dialog" aria-expanded="false" aria-controls="season-picker">
    {{- range slice "haru" "natsu" "aki" "fuyu" }}{{ partial "season-icon.html" . }}{{ end }}
    <span id="season-name">Spring</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <button type="button" id="day-night-toggle" accesskey="t" aria-label="Night mode" aria-pressed="false" title="Switch to night (Alt + T)">
    <svg class="day-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
    <svg class="night-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13a9 9 0 0 1-10-10 9 9 0 1 0 10 10Z"/></svg>
  </button>
  <div id="season-picker" role="dialog" aria-label="Choose a season" hidden>
    <div role="radiogroup" aria-label="Season">
      {{- range slice (dict "id" "haru" "name" "Spring") (dict "id" "natsu" "name" "Summer") (dict "id" "aki" "name" "Autumn") (dict "id" "fuyu" "name" "Winter") }}
      <button type="button" role="radio" data-season="{{ .id }}" aria-checked="false" tabindex="-1">{{ partial "season-icon.html" .id }}<span class="season-label">{{ .name }}</span></button>
      {{- end }}
    </div>
  </div>
</div>
